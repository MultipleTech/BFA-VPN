name: Extract Zip Contents to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write   # <--- Workflow ဖိုင်များကို Commit/Push လုပ်ခွင့်ပေးသည့် ခွင့်ပြုချက်

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and merge contents to root
        run: |
          rm -rf NekoBoxForAndroid-main
          unzip -q "NekoBoxForAndroid-main (1).zip" -d temp_dir

          INNER_DIR=$(ls temp_dir | head -n 1)
          if [ -d "temp_dir/$INNER_DIR" ]; then
            rsync -a temp_dir/"$INNER_DIR"/ .
          else
            rsync -a temp_dir/ .
          fi

          rm -rf temp_dir
          rm -f "NekoBoxForAndroid-main (1).zip"

      - name: Commit and Push changes back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Successfully extracted all files directly to root" || echo "No changes to commit"
          git push
          
