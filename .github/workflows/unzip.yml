name: Extract Zip Contents to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and merge contents to root
        run: |
          # 1. ယခင်ကျန်ခဲ့သော Folder အဟောင်းရှိပါက ဖျက်ပါ
          rm -rf NekoBoxForAndroid-main

          # 2. Zip ဖိုင်ကို ယာယီ temp_dir ထဲ ဖြည်ပါ
          unzip -q "NekoBoxForAndroid-main (1).zip" -d temp_dir

          # 3. Inner folder ထဲမှ ဖိုင်များ (Hidden files အပါအဝင်) ကို Root သို့ Merge လုပ်ပါ
          INNER_DIR=$(ls temp_dir | head -n 1)
          if [ -d "temp_dir/$INNER_DIR" ]; then
            rsync -a temp_dir/"$INNER_DIR"/ .
          else
            rsync -a temp_dir/ .
          fi

          # 4. temp_dir နှင့် Zip ဖိုင်အဟောင်းကို ရှင်းထုတ်ပါ
          rm -rf temp_dir
          rm -f "NekoBoxForAndroid-main (1).zip"

      - name: Commit and Push changes back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Successfully extracted all files directly to root" || echo "No changes to commit"
          git push
          
