name: Extract Zip Contents to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and move contents to root
        run: |
          # Zip ကို ယာယီ folder ထဲ ဖြည်ပါ
          unzip -q "NekoBoxForAndroid-main (1).zip" -d temp_dir

          # Folder ထဲမှ ဖိုင်အားလုံး (Hidden files အပါအဝင်) ကို Root သို့ ရွှေ့ပါ
          shopt -s dotglob
          mv temp_dir/*/* . 2>/dev/null || mv temp_dir/* .

          # ယာယီ Folder နှင့် Original Zip ဖိုင်ကို ရှင်းထုတ်ပါ
          rm -rf temp_dir
          rm -f "NekoBoxForAndroid-main (1).zip"

      - name: Commit and Push changes back to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move all zip contents directly to root" || echo "No changes to commit"
          git push
          
