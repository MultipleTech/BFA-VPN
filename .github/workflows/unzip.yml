name: Extract Zip to Root

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip file to project root
        run: |
          unzip -o "NekoBoxForAndroid-main (1).zip" -d .
          
