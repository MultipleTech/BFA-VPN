name: Build Custom BFA VPN

on:
  workflow_dispatch:

env:
  # ========== ဒီနေရာမှာ ပြင်ပါ ==========
  CUSTOM_APP_NAME: "BFA VPN"
  CUSTOM_PACKAGE_NAME: "com.bfa.vpn"
  CUSTOM_VERSION_NAME: "1.0.0"
  CUSTOM_VERSION_CODE: "100"
  # =====================================

jobs:
  customize-and-build:
    name: Customize + Build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- 1. App Name ပြောင်း ----------
      - name: Change App Name
        run: |
          echo "Changing app_name to: $CUSTOM_APP_NAME"
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">[^<]*<\/string>/<string name=\"app_name\">${CUSTOM_APP_NAME}<\/string>/" app/src/main/res/values/strings.xml
            echo "Updated strings.xml:"
            grep "app_name" app/src/main/res/values/strings.xml
          else
            echo "strings.xml not found!"
            exit 1
          fi

      # ---------- 2. Package + Version ပြောင်း (အရေးကြီး) ----------
      - name: Change Package Name & Version
        run: |
          echo "Updating nb4a.properties..."
          
          if [ -f "nb4a.properties" ]; then
            cat > nb4a.properties << EOF
PACKAGE_NAME=${CUSTOM_PACKAGE_NAME}
VERSION_NAME=${CUSTOM_VERSION_NAME}
PRE_VERSION_NAME=pre-${CUSTOM_VERSION_NAME}
VERSION_CODE=${CUSTOM_VERSION_CODE}
EOF
            echo "----- New nb4a.properties -----"
            cat nb4a.properties
          else
            echo "nb4a.properties not found!"
            exit 1
          fi

      - name: Show final values
        run: |
          echo "App Name     : $CUSTOM_APP_NAME"
          echo "Package Name : $CUSTOM_PACKAGE_NAME"
          echo "Version Name : $CUSTOM_VERSION_NAME"
          echo "Version Code : $CUSTOM_VERSION_CODE"

      # ---------- Build Environment ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ---------- Try Build ----------
      - name: Build LibCore (may fail)
        continue-on-error: true
        run: |
          if [ -f "./run" ]; then
            chmod +x ./run
            ./run lib core || echo "LibCore build skipped/failed"
          fi

      - name: Gradle Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew app:assembleOssRelease --stacktrace || ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BFA-VPN-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: List APKs
        run: find app/build/outputs -name "*.apk" || echo "No APK found"
