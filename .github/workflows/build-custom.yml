name: Build Custom BFA VPN

on:
  workflow_dispatch:          # Manual trigger
  push:
    branches: [ main ]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/main/res/values/strings.xml'
      - '.github/workflows/build-custom.yml'

env:
  # ========== ဒီနေရာမှာ သင်လိုချင်တဲ့ တန်ဖိုးတွေ ပြင်ပါ ==========
  CUSTOM_APP_NAME: "BFA VPN"
  CUSTOM_APPLICATION_ID: "com.bfa.vpn"
  CUSTOM_VERSION_NAME: "1.0.0"
  CUSTOM_VERSION_CODE: "100"
  # ========================================================

jobs:
  customize-and-build:
    name: Customize + Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ---------- Customization Steps ----------
      - name: Apply Custom App Name
        run: |
          echo "Changing app_name to: $CUSTOM_APP_NAME"
          # strings.xml ထဲက app_name ကို ပြောင်း
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">${CUSTOM_APP_NAME}<\/string>/" app/src/main/res/values/strings.xml
            echo "Updated strings.xml"
            grep "app_name" app/src/main/res/values/strings.xml
          fi

      - name: Apply Custom applicationId + Version
        run: |
          echo "Changing applicationId to: $CUSTOM_APPLICATION_ID"
          echo "Version: $CUSTOM_VERSION_NAME ($CUSTOM_VERSION_CODE)"

          # app/build.gradle.kts ကို ပြောင်း
          if [ -f "app/build.gradle.kts" ]; then
            # applicationId
            sed -i "s/applicationId\s*=\s*\".*\"/applicationId = \"$CUSTOM_APPLICATION_ID\"/" app/build.gradle.kts
            
            # versionName
            sed -i "s/versionName\s*=\s*\".*\"/versionName = \"$CUSTOM_VERSION_NAME\"/" app/build.gradle.kts
            
            # versionCode
            sed -i "s/versionCode\s*=\s*[0-9]*/versionCode = $CUSTOM_VERSION_CODE/" app/build.gradle.kts
            
            echo "----- Updated build.gradle.kts -----"
            grep -E "applicationId|versionName|versionCode" app/build.gradle.kts
          fi

      - name: Show changes
        run: |
          echo "=== Final Custom Values ==="
          echo "App Name        : $CUSTOM_APP_NAME"
          echo "Application ID  : $CUSTOM_APPLICATION_ID"
          echo "Version Name    : $CUSTOM_VERSION_NAME"
          echo "Version Code    : $CUSTOM_VERSION_CODE"

      # ---------- Build Environment ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ---------- Build LibCore (optional, may fail if NDK not perfect) ----------
      - name: Try Build LibCore
        continue-on-error: true
        run: |
          if [ -f "./run" ]; then
            chmod +x ./run
            ./run lib core || echo "LibCore build failed or skipped - will try with existing aar"
          fi

      # ---------- Gradle Build ----------
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # NDK path (ရှိရင်)
          if [ -d "$ANDROID_HOME/ndk" ]; then
            NDK_PATH=$(find $ANDROID_HOME/ndk -maxdepth 1 -type d | tail -1)
            echo "ndk.dir=$NDK_PATH" >> local.properties
          fi

          chmod +x gradlew
          ./gradlew app:assembleOssRelease --stacktrace || ./gradlew app:assembleRelease --stacktrace

      # ---------- Upload ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BFA-VPN-APK
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/**/*.apk
          if-no-files-found: warn

      - name: List built files
        run: |
          find app/build/outputs -name "*.apk" || echo "No APK found"
