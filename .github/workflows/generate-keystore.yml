name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
     - name: Generate keystore
  env:
    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  run: |
    test "${#KEYSTORE_PASSWORD}" -ge 6 || {
      echo "KEYSTORE_PASSWORD must be at least 6 characters"
      exit 1
    }

    keytool -genkeypair \
      -v \
      -keystore bfa-vpn-release.jks \
      -alias bfa-vpn \
      -keyalg RSA \
      -keysize 2048 \
      -validity 10000 \
      -storepass "$KEYSTORE_PASSWORD" \
      -keypass "$KEYSTORE_PASSWORD" \
      -dname "CN=BFA VPN, OU=Mobile, O=BFA, L=Unknown, ST=Unknown, C=MM"
    
