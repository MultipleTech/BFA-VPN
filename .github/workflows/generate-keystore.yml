name: Generate Android Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore bfa-vpn-release.jks \
            -alias bfa-vpn \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=BFA VPN, OU=Mobile, O=BFA, L=Unknown, ST=Unknown, C=MM"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfa-vpn-keystore
          path: bfa-vpn-release.jks
          retention-days: 1
          
