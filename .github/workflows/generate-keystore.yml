name: Generate BFA VPN Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Android Keystore
    runs-on: ubuntu-latest

    env:
      KEYSTORE_FILE: bfa-vpn-release.jks
      KEY_ALIAS: bfa-vpn
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Validate passwords
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "KEYSTORE_PASSWORD secret is missing"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "KEY_PASSWORD secret is missing"
            exit 1
          fi

          if [ "${#KEYSTORE_PASSWORD}" -lt 6 ]; then
            echo "KEYSTORE_PASSWORD must be at least 6 characters"
            exit 1
          fi

          if [ "${#KEY_PASSWORD}" -lt 6 ]; then
            echo "KEY_PASSWORD must be at least 6 characters"
            exit 1
          fi

      - name: Generate keystore
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=BFA VPN, OU=Mobile, O=BFA, L=Unknown, ST=Unknown, C=MM"

      - name: Show certificate information
        shell: bash
        run: |
          keytool -list \
            -v \
            -keystore "$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" \
            | grep -E "Alias name:|Entry type:|SHA256:|Valid from:"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: bfa-vpn-keystore
          path: bfa-vpn-release.jks
          if-no-files-found: error
          retention-days: 1
          
